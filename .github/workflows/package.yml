name: Build and Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/Player.App/Player.App.csproj
  RUNTIME_ID: win-x64
  SELF_CONTAINED_DIR: artifacts/RelayPlayer-win-x64-self-contained
  FRAMEWORK_DEPENDENT_DIR: artifacts/RelayPlayer-win-x64-framework-dependent-portable
  SELF_CONTAINED_PACKAGE: artifacts/RelayPlayer-win-x64-self-contained.zip
  FRAMEWORK_DEPENDENT_PACKAGE: artifacts/RelayPlayer-win-x64-framework-dependent-portable.zip

jobs:
  package:
    name: Build, test, and package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore .\Player.sln

      - name: Build
        run: dotnet build .\Player.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\Player.sln -c Release --no-build

      - name: Publish win-x64 self-contained
        run: >
          dotnet publish $env:PROJECT_PATH
          -c Release
          -r $env:RUNTIME_ID
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o $env:SELF_CONTAINED_DIR

      - name: Publish win-x64 framework-dependent portable
        run: >
          dotnet publish $env:PROJECT_PATH
          -c Release
          -r $env:RUNTIME_ID
          --self-contained false
          -p:PublishSingleFile=false
          -o $env:FRAMEWORK_DEPENDENT_DIR

      - name: Create zip packages
        run: |
          Compress-Archive -Path "$env:SELF_CONTAINED_DIR\*" -DestinationPath $env:SELF_CONTAINED_PACKAGE -Force
          Compress-Archive -Path "$env:FRAMEWORK_DEPENDENT_DIR\*" -DestinationPath $env:FRAMEWORK_DEPENDENT_PACKAGE -Force

      - name: Upload self-contained package artifact
        uses: actions/upload-artifact@v6
        with:
          name: RelayPlayer-win-x64-self-contained
          path: ${{ env.SELF_CONTAINED_PACKAGE }}
          if-no-files-found: error

      - name: Upload framework-dependent package artifact
        uses: actions/upload-artifact@v6
        with:
          name: RelayPlayer-win-x64-framework-dependent-portable
          path: ${{ env.FRAMEWORK_DEPENDENT_PACKAGE }}
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $env:SELF_CONTAINED_PACKAGE $env:FRAMEWORK_DEPENDENT_PACKAGE --clobber
          } else {
            gh release create $tag $env:SELF_CONTAINED_PACKAGE $env:FRAMEWORK_DEPENDENT_PACKAGE --generate-notes --title $tag
          }
